name: Gateway contract tests

concurrency:
  group: ai-pack-gateway-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]

jobs:
  licensing-contract:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - gateway: seo-pack/gateway
          - gateway: safety-pack/gateway
          - gateway: revenue-pack/gateway
          - gateway: matching-pack/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.gateway }}/requirements.txt
      - name: Install gateway dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.gateway }}/requirements.txt" pytest==8.4.2
      - name: Run licensing and atomic quota contract tests
        env:
          GATEWAY_MODULE_PATH: ${{ matrix.gateway }}/main.py
          AI_PACK_TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m pytest -q tests/test_gateway_contract.py

      - name: Run Safety tenant policy tests
        if: matrix.gateway == 'safety-pack/gateway'
        run: |
          python -m pip install PyYAML==6.0.2
          python -m pytest -q tests/test_safety_policy.py tests/test_moderation_eval.py tests/test_release_guardrails.py tests/test_safety_benchmark_validation.py
          python -m py_compile scripts/evaluate_moderation.py scripts/validate_safety_benchmark.py


  wordpress-plugin-php-contract:
    name: WordPress plugin PHP and license header contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none
      - name: Lint all pack plugin PHP files
        run: |
          set -euo pipefail
          find seo-pack/wordpress-plugin revenue-pack/wordpress-plugin matching-pack/wordpress-plugin safety-pack/wordpress-plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Require domain header in every pack API client
        run: |
          set -euo pipefail
          for client in \
            seo-pack/wordpress-plugin/seo-pack/includes/class-api-client.php \
            revenue-pack/wordpress-plugin/revenue-pack/includes/class-api-client.php \
            matching-pack/wordpress-plugin/matching-pack/includes/class-api-client.php \
            safety-pack/wordpress-plugin/safety-pack/includes/class-api-client.php; do
            grep -q 'X-Site-Domain' "$client"
          done
          test "$(grep -c 'X-Site-Domain' safety-pack/wordpress-plugin/safety-pack/includes/class-api-client.php)" -ge 2


  smoke-test-client-contract:
    name: Smoke-test client auth and health-state contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile smoke-test client
        run: python -m py_compile scripts/smoke_test_packs.py
      - name: Run smoke-test client contract tests
        run: |
          python -m pip install pytest==8.4.2 PyYAML==6.0.2
          python -m pytest -q tests/test_smoke_test_packs.py tests/test_distribution_builder.py

  matching-assistant-runtime-image:
    name: Build and import-check only Matching ai_assistant
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ai-packs PR source
        uses: actions/checkout@v4

      - name: Checkout pinned mobApp source
        uses: actions/checkout@v4
        with:
          repository: yarsalam/mobApp
          ref: 4344cb05afe461551e1bfdc379b26a3c0fedddd9
          path: upstream/mobApp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install distribution validation dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Build and validate Matching distribution; require pandas
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from scripts.build_distributions import PACKS, SERVICE, build_one
          from scripts.validate_distributions import validate_pack

          if "pandas==2.2.3" not in SERVICE["ai_assistant"]["requirements"]:
              raise SystemExit("ai_assistant pandas pin is missing")
          output = Path("dist").resolve()
          output.mkdir(parents=True, exist_ok=True)
          built = build_one("matching-pack", PACKS["matching-pack"], Path("upstream/mobApp").resolve(), output)
          result = validate_pack(output, "matching-pack")
          req = (built / "services/ai_assistant/requirements.txt").read_text(encoding="utf-8").splitlines()
          if "pandas==2.2.3" not in req:
              raise SystemExit("generated ai_assistant requirements do not contain pandas==2.2.3")
          print({"distribution": str(built), "validation": result})
          PY

      - name: Validate image-only Compose and single-service override
        run: |
          docker compose \
            --env-file deploy/env/matching-pack.env.example \
            -f deploy/compose/matching-pack.json \
            -f deploy/compose/matching-ai-assistant-override.yaml \
            config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build only ai_assistant image for validation
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file dist/matching-pack/services/ai_assistant/Dockerfile \
            --tag ai-assistant-runtime-check:ci \
            --load \
            dist/matching-pack/services/ai_assistant

      - name: Verify pandas and application imports inside image
        run: |
          docker run --rm --entrypoint python ai-assistant-runtime-check:ci -c \
            "import pandas; import app; from core.behavior import analyze_behavior; print('ai_assistant imports OK; pandas=' + pandas.__version__)"
