name: Matching ai_assistant image publisher (registration)

on:
  workflow_dispatch:
    inputs:
      mobapp_ref:
        description: "Exact branch, tag, or commit in yarsalam/mobApp"
        required: true
        default: "93bcb0d9ddf78ed31580d4aa2e3758b6397c1f0b"
        type: string

permissions:
  contents: read

jobs:
  registration_notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain how to run the feature-branch publisher
        run: |
          echo "This is a workflow-dispatch registration stub only."
          echo "After reviewing the publisher PR, select branch:"
          echo "fix/matching-ai-assistant-runtime-image"
          echo "That branch contains the isolated ai_assistant-only build/publish implementation."
          echo "This default-branch stub does not build or publish images and does not modify the VPS."
