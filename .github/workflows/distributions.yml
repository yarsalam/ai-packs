name: Build self-contained AI Pack distributions

on:
  pull_request:
    paths:
      - "scripts/**"
      - "seo-pack/**"
      - "safety-pack/**"
      - "revenue-pack/**"
      - "matching-pack/**"
      - ".github/workflows/distributions.yml"
  workflow_dispatch:
    inputs:
      mobapp_ref:
        description: "Git ref in yarsalam/mobApp used as the service source"
        required: true
        default: "fix/ai-pack-commercial-readiness"
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ai-packs
        uses: actions/checkout@v4

      - name: Checkout original microservices
        uses: actions/checkout@v4
        with:
          repository: yarsalam/mobApp
          ref: ${{ github.event_name == 'release' && 'main' || (inputs.mobapp_ref || 'fix/ai-pack-commercial-readiness') }}
          path: upstream/mobApp

      - name: Install packaging tools
        run: python -m pip install --upgrade pip PyYAML==6.0.2

      - name: Build four stand-alone distributions
        run: python scripts/build_distributions.py --mobapp-root upstream/mobApp --output-dir dist

      - name: Validate distribution structure and Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_distributions.py --dist-dir dist
          find dist -type f -name '*.py' -not -path 'dist/*/model-init/*' -print0 | xargs -0 -r python -m py_compile
          for compose in dist/*/compose.yaml; do
            folder="$(dirname "$compose")"
            echo "Validating $compose"
            docker compose --env-file "$folder/.env.example" -f "$compose" config --quiet
          done

      - name: Build gateway images
        shell: bash
        run: |
          set -euo pipefail
          for pack in seo-pack safety-pack revenue-pack matching-pack; do
            docker build -t "ai-packs-check-$pack:ci" "dist/$pack/gateway"
          done

      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: ai-pack-distributions
          path: |
            dist/*.zip
            dist/index.json
          if-no-files-found: error
          retention-days: 14

      - name: Attach pack and WordPress ZIPs to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
